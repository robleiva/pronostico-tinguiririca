name: Actualizacion Diaria Pronostico

on:
  schedule:
    # Corre todos los días a las 08:30 UTC (~05:30 hora de Chile)
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar corrida, guardar historico y generar HTML
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APPLICATION_KEY: ${{ secrets.AMBIENT_APPLICATION_KEY }}
          MAC_PORTILLO: ${{ secrets.MAC_PORTILLO }}
          MAC_TINGUIRIRICA: ${{ secrets.MAC_TINGUIRIRICA }}
        run: |
          python generar_pronostico.py

      - name: Guardar datos historicos en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historico/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualizar historico observaciones y pronosticos [skip ci]" && git push origin main)

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4
